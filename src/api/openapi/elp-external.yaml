openapi: 3.0.3
info:
  title: Electros LaunchPad AtomOS Service API
  description: |
    Meson-compatible VM surface (temporarily on matcher port 7777; Service
    canonical is 7781) backed by Electros LaunchPad. Aligns with the AtomOS Bruno
    `service/` collection (Bearer auth on all Service paths, including `/`
    and `/version`). All endpoints share this listen address.
  version: 0.3.0
servers:
  - url: https://127.0.0.1:7777
    description: Host-local listen (HTTPS default)
  - url: https://192.168.67.1:7777
    description: Same gateway as seen from an Electros LaunchPad VM on 192.168.67.0/24
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Ping
      description: AtomOS Service ping. Requires Bearer (Bruno `auth: inherit`).
      responses:
        "200":
          description: Alive
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Electros LaunchPad backend unreachable
  /version:
    get:
      summary: Version
      description: Service + backend version. Requires Bearer.
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  backend:
                    type: string
                  backend_version:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/register:
    post:
      summary: Register (launch) VM
      description: AtomOS path; same handler as create_machine.
      responses:
        "200":
          description: Registered
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Backend unreachable
  /api/v1.0/create_machine:
    post:
      summary: Create machine (Meson alias of register)
      responses:
        "200":
          description: Registered
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Backend unreachable
  /api/v1.0/running:
    get:
      summary: List VMs for client
      description: AtomOS path; same handler as get_machine. Requires JSON body with client_uid.
      responses:
        "200":
          description: VM list
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/get_machine:
    get:
      summary: Get machines (Meson alias of running)
      description: Requires JSON body with client_uid.
      responses:
        "200":
          description: VM list
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/unregister:
    delete:
      summary: Unregister (delete) VM
      description: AtomOS path; same handler as delete_machine.
      responses:
        "200":
          description: Unregistered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
  /api/v1.0/delete_machine:
    delete:
      summary: Delete machine (Meson alias of unregister)
      responses:
        "200":
          description: Unregistered
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
  /api/v1.0/start:
    post:
      summary: Start VM
      responses:
        "200":
          description: Started
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Already running
  /api/v1.0/stop:
    post:
      summary: Stop VM
      responses:
        "200":
          description: Stopped
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/reboot:
    post:
      summary: Reboot VM
      responses:
        "200":
          description: Rebooted
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/images/find:
    get:
      summary: Find images
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: remote
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Image catalog
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/authenticate/cert:
    get:
      summary: Fetch remote TLS certificate fingerprint (Electros)
      description: |
        Electros-compatible probe: TLS-connect to `host` on matcher port 7777
        (fallback storage 7772), return SHA-256 DER fingerprint. Does not call
        an HTTP route on the remote — same behavior as Electros auth on :47777.
      security: []
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: Remote IP or hostname to fingerprint
          example: 172.16.25.197
      responses:
        "200":
          description: Fingerprint
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: "46:59:75:6B:51:DE:E8:A0:3F:DB:41:0C:4C:D5:5B:82:B0:9A:E4:2A:5E:71:3F:26:59:9F:E1:A9:0C:B6:8C:28"
                  validated:
                    type: boolean
        "400":
          description: Missing host
        "500":
          description: Remote TLS fetch failed
  /fingerprint:
    get:
      summary: Local TLS fingerprint alias
      description: |
        Returns this process's HTTPS certificate fingerprint (HTTPS is default).
        For Electros TOFU against Electros LaunchPad, prefer dialing this host's
        `:7777` TLS (or use `/api/v1/authenticate/cert?host=`).
      security: []
      responses:
        "200":
          description: Fingerprint
        "503":
          description: HTTPS disabled
  /healthz:
    get:
      summary: Liveness (extra)
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness (extra)
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /v1/instances:
    get:
      summary: Provisional merged instance list (extra)
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [elp, multipass]
      responses:
        "200":
          description: Instances
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Same pattern as AtomOS Bruno (`Authorization: Bearer {{auth_token}}`).
        Configure with `--api-token` / `ELP_API_TOKEN`, or use
        `--insecure-no-auth` for local development only.
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [missing_token, invalid_token]
              message:
                type: string
