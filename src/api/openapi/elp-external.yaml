openapi: 3.0.3
info:
  title: Electros LaunchPad Spot API
  description: |
    Spot v2 VM and marketplace-service surface on matcher port 7777, backed by
    Electros LaunchPad. Aligns with the AtomOS Bruno `spot/` collection (Bearer
    auth on `/`, `/version`, and `/api/v1.0/*`). All endpoints share this listen
    address.
  version: 0.4.0
servers:
  - url: https://127.0.0.1:7777
    description: Host-local listen (HTTPS default)
  - url: https://192.168.67.1:7777
    description: Same gateway as seen from an Electros LaunchPad VM on 192.168.67.0/24
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Ping
      description: Spot ping. Requires Bearer (Bruno `auth: inherit`).
      responses:
        "200":
          description: Alive
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Electros LaunchPad backend unreachable
  /version:
    get:
      summary: Version
      description: Service + backend version. Requires Bearer.
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  backend:
                    type: string
                  backend_version:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/register:
    post:
      summary: Register (create + boot) Spot VM
      description: |
        Flat v2 spec (`cpu`, `mem`, `os`, `storage`, `networks`, `auth`, `tags`).
        `startup.template` renders a marketplace recipe and ignores `cloud_init_b64`.
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  vm_uid:
                    type: string
                  vm_name:
                    type: string
                  status:
                    type: string
                    example: running
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "507":
          description: Insufficient resources
        "503":
          description: Backend unreachable
  /api/v1.0/canallocate:
    get:
      summary: Can allocate Spot VM
      description: Dry-run. Same v2 objects as register without identity. POST is also accepted.
      responses:
        "200":
          description: Placement result
          content:
            application/json:
              schema:
                type: object
                properties:
                  canallocate:
                    type: boolean
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Can allocate Spot VM
      responses:
        "200":
          description: Placement result
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/running:
    get:
      summary: List running Spot VMs
      description: |
        No body. JSON array of public v2 objects (secrets omitted). Includes
        Electros LaunchPad and stock Multipass instances; first list assigns a
        stable `vm_uid` in the sidecar registry.

      responses:
        "200":
          description: Instance list
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/credentials/{vm_uid}:
    get:
      summary: Get Spot VM credentials
      parameters:
        - name: vm_uid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SSH and/or template URL
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: VM unknown
  /api/v1.0/unregister:
    delete:
      summary: Unregister (delete) Spot VM
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found
  /api/v1/authenticate/cert:
    get:
      summary: Fetch remote TLS certificate fingerprint (Electros)
      description: |
        Electros-compatible probe: TLS-connect to `host` on matcher port 7777
        (fallback storage 7772), return SHA-256 DER fingerprint. Does not call
        an HTTP route on the remote — same behavior as Electros auth on :47777.
      security: []
      parameters:
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: Remote IP or hostname to fingerprint
          example: 172.16.25.197
      responses:
        "200":
          description: Fingerprint
          content:
            application/json:
              schema:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: "46:59:75:6B:51:DE:E8:A0:3F:DB:41:0C:4C:D5:5B:82:B0:9A:E4:2A:5E:71:3F:26:59:9F:E1:A9:0C:B6:8C:28"
                  validated:
                    type: boolean
        "400":
          description: Missing host
        "500":
          description: Remote TLS fetch failed
  /fingerprint:
    get:
      summary: Local TLS fingerprint alias
      description: |
        Returns this process's HTTPS certificate fingerprint (HTTPS is default).
        For Electros TOFU against Electros LaunchPad, prefer dialing this host's
        `:7777` TLS (or use `/api/v1/authenticate/cert?host=`).
      security: []
      responses:
        "200":
          description: Fingerprint
        "503":
          description: HTTPS disabled
  /ca.crt:
    get:
      summary: Local HTTPS CA (PEM)
      description: |
        Returns the PEM CA that signed this process's HTTPS certificate (auto-generated
        LaunchPad CA), or the served leaf when `--cert` / AtomOS certs are used.
        Guests install this so service UIs can call `https://192.168.67.1:7777` with
        verify on. Unauthenticated, same class as `/fingerprint`.
      security: []
      responses:
        "200":
          description: PEM certificate
          content:
            application/x-pem-file:
              schema:
                type: string
        "503":
          description: HTTPS disabled
  /healthz:
    get:
      summary: Liveness (extra)
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness (extra)
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /v1/instances:
    get:
      summary: Provisional merged instance list (extra)
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [elp, multipass]
      responses:
        "200":
          description: Instances
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Same pattern as AtomOS Bruno (`Authorization: Bearer {{auth_token}}`).
        Configure with `--api-token` / `ELP_API_TOKEN`, or use
        `--insecure-no-auth` for local development only.
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                enum: [missing_token, invalid_token]
              message:
                type: string
