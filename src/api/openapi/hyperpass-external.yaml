openapi: 3.0.3
info:
  title: Hyperpass External REST API
  description: |
    Placeholder OpenAPI contract for the hyperpass-api sidecar.

    The definitive external standard will replace resource shapes and paths once
    the API reference is provided. Current endpoints are infrastructure smoke
    paths used to validate auth, health, and gRPC translation.
  version: 0.1.0-placeholder
servers:
  - url: http://127.0.0.1:51052
    description: Default local listen address
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      summary: Readiness probe (daemon gRPC reachable)
      security: []
      responses:
        "200":
          description: Daemon reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Daemon unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
  /v1/instances:
    get:
      summary: List instances (provisional)
      description: |
        Merges Hyperpass and (when discovered) stock Multipass instances.
        Each item includes a `source` field: `hyperpass` or `multipass`.
      parameters:
        - name: ipv4
          in: query
          schema:
            type: string
            enum: ["true", "false"]
            default: "true"
        - name: source
          in: query
          description: Restrict to one daemon
          schema:
            type: string
            enum: [hyperpass, multipass]
      responses:
        "200":
          description: Instance list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceList"
        "400":
          description: Invalid source filter
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/DaemonError"
        "503":
          description: Multipass requested but not discovered
  /v1/operations/{operationId}:
    get:
      summary: Get long-running operation status
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown operation
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DaemonError:
      description: Upstream hyperpassd gRPC failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ReadyStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        message:
          type: string
        hyperpass:
          type: string
          enum: [ready, not_ready]
        multipass:
          type: string
          enum: [ready, not_ready, unavailable]
    InstanceList:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: "#/components/schemas/Instance"
        errors:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              message:
                type: string
              code:
                type: integer
    Instance:
      type: object
      properties:
        name:
          type: string
        source:
          type: string
          enum: [hyperpass, multipass]
        state:
          type: string
        release:
          type: string
        os:
          type: string
        ipv4:
          type: array
          items:
            type: string
        zone:
          type: string
    Operation:
      type: object
      required: [id, kind, state]
      properties:
        id:
          type: string
        kind:
          type: string
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        message:
          type: string
        error:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
