openapi: 3.0.3
info:
  title: Hyperpass AtomOS Service API
  description: |
    Meson-compatible Service daemon surface (port 7781) backed by Hyperpass.
    Aligns with the AtomOS Bruno `service/` collection.
  version: 0.2.0
servers:
  - url: http://127.0.0.1:7781
    description: Default local Service listen address
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Ping
      security: []
      responses:
        "200":
          description: Alive
        "503":
          description: Hyperpass backend unreachable
  /version:
    get:
      summary: Version
      security: []
      responses:
        "200":
          description: Service version
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  backend:
                    type: string
                  backend_version:
                    type: string
  /api/v1.0/register:
    post:
      summary: Register (launch) VM
      description: AtomOS path; same handler as create_machine.
      responses:
        "200":
          description: Registered
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Backend unreachable
  /api/v1.0/create_machine:
    post:
      summary: Create machine (Meson alias of register)
      responses:
        "200":
          description: Registered
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Backend unreachable
  /api/v1.0/running:
    get:
      summary: List VMs for client
      description: AtomOS path; same handler as get_machine. Requires JSON body with client_uid.
      responses:
        "200":
          description: VM list
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/get_machine:
    get:
      summary: Get machines (Meson alias of running)
      description: Requires JSON body with client_uid.
      responses:
        "200":
          description: VM list
        "400":
          description: Bad request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1.0/unregister:
    delete:
      summary: Unregister (delete) VM
      description: AtomOS path; same handler as delete_machine.
      responses:
        "200":
          description: Unregistered
        "404":
          description: Not found
  /api/v1.0/delete_machine:
    delete:
      summary: Delete machine (Meson alias of unregister)
      responses:
        "200":
          description: Unregistered
        "404":
          description: Not found
  /api/v1.0/start:
    post:
      summary: Start VM
      responses:
        "200":
          description: Started
        "409":
          description: Already running
  /api/v1.0/stop:
    post:
      summary: Stop VM
      responses:
        "200":
          description: Stopped
  /api/v1.0/reboot:
    post:
      summary: Reboot VM
      responses:
        "200":
          description: Rebooted
  /api/v1.0/images/find:
    get:
      summary: Find images
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: remote
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Image catalog
  /healthz:
    get:
      summary: Liveness (extra)
      security: []
      responses:
        "200":
          description: OK
  /readyz:
    get:
      summary: Readiness (extra)
      security: []
      responses:
        "200":
          description: Ready
        "503":
          description: Not ready
  /v1/instances:
    get:
      summary: Provisional merged instance list (extra)
      parameters:
        - name: source
          in: query
          schema:
            type: string
            enum: [hyperpass, multipass]
      responses:
        "200":
          description: Instances
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
