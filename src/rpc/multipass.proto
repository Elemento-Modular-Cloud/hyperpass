syntax = "proto3";
package multipass;

import "google/protobuf/timestamp.proto";

service Rpc {
    rpc create (stream LaunchRequest) returns (stream LaunchReply);
    rpc launch (stream LaunchRequest) returns (stream LaunchReply);
    rpc purge (stream PurgeRequest) returns (stream PurgeReply);
    rpc find (stream FindRequest) returns (stream FindReply);
    rpc info (stream InfoRequest) returns (stream InfoReply);
    rpc list (stream ListRequest) returns (stream ListReply);
    rpc networks (stream NetworksRequest) returns (stream NetworksReply);
    rpc mount (stream MountRequest) returns (stream MountReply);
    rpc ping (PingRequest) returns (PingReply);
    rpc recover (stream RecoverRequest) returns (stream RecoverReply);
    rpc ssh_info (stream SSHInfoRequest) returns (stream SSHInfoReply);
    rpc start (stream StartRequest) returns (stream StartReply);
    rpc stop (stream StopRequest) returns (stream StopReply);
    rpc suspend (stream SuspendRequest) returns (stream SuspendReply);
    rpc restart (stream RestartRequest) returns (stream RestartReply);
    rpc delet (stream DeleteRequest) returns (stream DeleteReply);
    rpc umount (stream UmountRequest) returns (stream UmountReply);
    rpc version (stream VersionRequest) returns (stream VersionReply);
    rpc get (stream GetRequest) returns (stream GetReply);
    rpc set (stream SetRequest) returns (stream SetReply);
    rpc keys (stream KeysRequest) returns (stream KeysReply);
    rpc authenticate (stream AuthenticateRequest) returns (stream AuthenticateReply);
    rpc snapshot (stream SnapshotRequest) returns (stream SnapshotReply);
    rpc restore (stream RestoreRequest) returns (stream RestoreReply);
    rpc clone (stream CloneRequest) returns (stream CloneReply);
    rpc daemon_info (stream DaemonInfoRequest) returns (stream DaemonInfoReply);
    rpc wait_ready (stream WaitReadyRequest) returns (stream WaitReadyReply);
    rpc zones (stream ZonesRequest) returns (stream ZonesReply);
    rpc zones_state (stream ZonesStateRequest) returns (stream ZonesStateReply);
    rpc cache_info (stream CacheInfoRequest) returns (stream CacheInfoReply);
    rpc cache_delete (stream CacheDeleteRequest) returns (stream CacheDeleteReply);

    rpc find_models (stream FindModelsRequest) returns (stream FindModelsReply);
    rpc pull_model (stream PullModelRequest) returns (stream PullModelReply);
    rpc load_model (stream LoadModelRequest) returns (stream LoadModelReply);
    rpc unload_model (stream UnloadModelRequest) returns (stream UnloadModelReply);
    rpc list_models (stream ListModelsRequest) returns (stream ListModelsReply);
    rpc list_llm_backends (stream ListLlmBackendsRequest) returns (stream ListLlmBackendsReply);
    rpc create_api_key (stream CreateApiKeyRequest) returns (stream CreateApiKeyReply);
    rpc list_api_keys (stream ListApiKeysRequest) returns (stream ListApiKeysReply);
    rpc revoke_api_key (stream RevokeApiKeyRequest) returns (stream RevokeApiKeyReply);
    rpc verify_api_key (stream VerifyApiKeyRequest) returns (stream VerifyApiKeyReply);
    rpc touch_model (stream TouchModelRequest) returns (stream TouchModelReply);
    rpc delete_model (stream DeleteModelRequest) returns (stream DeleteModelReply);
    rpc stream_model_logs (stream StreamModelLogsRequest) returns (stream StreamModelLogsReply);
}

message LaunchRequest {
    string instance_name = 1;
    string image = 2;
    string kernel_name = 3;
    int32 num_cores = 4;
    string mem_size = 5; // units?
    string disk_space = 6; // units?
    string time_zone = 7;
    string cloud_init_user_data = 8;
    string remote_name = 9;
    int32 verbosity_level = 11;

    message NetworkOptions {
        enum Mode {
            AUTO = 0;
            MANUAL = 1;
        }

        string id = 1;
        Mode mode = 2;
        string mac_address = 3;
    }
    repeated NetworkOptions network_options = 12;
    bool permission_to_bridge = 13;
    int32 timeout = 14;
    string password = 15;
    string zone = 16;
}

message LaunchError {
    enum ErrorCodes {
        OK = 0;
        INVALID_MEM_SIZE = 1;
        INVALID_DISK_SIZE = 2;
        INVALID_HOSTNAME = 3;
        INVALID_NETWORK = 4;
        ZONE_UNAVAILABLE = 5;
    }
    repeated ErrorCodes error_codes = 1;
}

message LaunchProgress {
    enum ProgressType {
        IMAGE = 0;
        EXTRACT = 1;
        VERIFY = 2;
        WAITING = 3;
    }
    ProgressType type = 1;
    string percent_complete = 2;
}

message UpdateInfo {
    string version = 1;
    string url = 2;
    string title = 3;
    string description = 4;
}

message LaunchReply {
    message Alias {
        string name = 1;
        string instance = 2;
        string command = 3;
        string working_directory = 4;
    }
    oneof create_oneof {
        string vm_instance_name = 1;
        LaunchProgress launch_progress = 2;
        string create_message = 3;
    }
    string log_line = 6;
    UpdateInfo update_info = 7;
    string reply_message = 8;
    repeated string nets_need_bridging = 9;
    repeated Alias aliases_to_be_created = 10;
    repeated string workspaces_to_be_created = 11;
    bool password_requested = 12;
    string zone = 13;
}

message PurgeRequest {
    int32 verbosity_level = 1;
}

message PurgeReply {
    string log_line = 1;
    repeated string purged_instances = 2;
}

message FindRequest {
    string search_string = 1;
    string remote_name = 2;
    int32 verbosity_level = 3;
    bool allow_unsupported = 4;
    bool force_manifest_network_download = 5;
}

message FindReply {
    message ImageInfo {
        string os = 1;
        string release = 2;
        string version = 3;
        repeated string aliases = 4;
        string codename = 5;
        string remote_name = 6;
        int64 min_disk = 7;
    }
    repeated ImageInfo images_info = 1;
    string log_line = 2;
}

message InstanceSnapshotPair {
    string instance_name = 1;
    optional string snapshot_name = 2; // if this is present, the msg specifies a snapshot; otherwise, an instance
}

message InfoRequest {
    repeated InstanceSnapshotPair instance_snapshot_pairs = 1;
    int32 verbosity_level = 3;
    bool no_runtime_information = 4;
    bool snapshots = 5;
}

message IdMap {
    int32 host_id = 1;
    int32 instance_id = 2;
}

message MountMaps {
    repeated IdMap uid_mappings = 1;
    repeated IdMap gid_mappings = 2;
}

message MountInfo {
    message MountPaths {
        string source_path = 1;
        string target_path = 2;
        MountMaps mount_maps = 3;
    }
    uint32 longest_path_len = 1;
    repeated MountPaths mount_paths = 2;
}

message InstanceStatus {
    enum Status {
        UNKNOWN = 0;
        RUNNING = 1;
        STARTING = 2;
        RESTARTING = 3;
        STOPPED = 4;
        DELETED = 5;
        DELAYED_SHUTDOWN = 6;
        SUSPENDING = 7;
        SUSPENDED = 8;
        UNAVAILABLE = 9;
    }
    Status status = 1;
}

message InstanceDetails {
    string image_release = 1;
    string current_release = 2;
    string id = 3;
    string load = 4;
    string memory_usage = 5;
    string disk_usage = 6;
    repeated string ipv4 = 7;
    reserved 8;
    reserved "ipv6";
    optional int32 num_snapshots = 9;
    string cpu_times = 10;
    string uptime = 11;
    google.protobuf.Timestamp creation_timestamp = 12;
    string os = 13;
}

message SnapshotFundamentals {
    string snapshot_name = 1;
    string parent = 2;
    string comment = 3;
    google.protobuf.Timestamp creation_timestamp = 4;
}

message SnapshotDetails {
    SnapshotFundamentals fundamentals = 1;
    string size = 2;
    repeated string children = 4;
}

message DetailedInfoItem {
    string name = 1;
    InstanceStatus instance_status = 2;
    string memory_total = 3;
    string disk_total = 4;
    string cpu_count = 5;
    MountInfo mount_info = 6;

    oneof extra_info {
        InstanceDetails instance_info = 7;
        SnapshotDetails snapshot_info = 8;
    }

    Zone zone = 9;
}

message InfoReply {
    repeated DetailedInfoItem details = 1;
    bool snapshots = 2; // useful to determine what entity (instance/snapshot) was absent when details are empty
    string log_line = 3;
    UpdateInfo update_info = 4;
}

message ListRequest {
    int32 verbosity_level = 1;
    bool snapshots = 2;
    bool request_ipv4 = 3;
}

message ListVMInstance {
    string name = 1;
    InstanceStatus instance_status = 2;
    repeated string ipv4 = 3;
    string current_release = 5;
    string os = 6;
    Zone zone = 7;
}

message ListVMSnapshot {
    string name = 1;
    SnapshotFundamentals fundamentals = 2;
}

message InstancesList {
    repeated ListVMInstance instances = 1;
}

message SnapshotsList {
    repeated ListVMSnapshot snapshots = 1;
}

message ListReply {
    oneof list_contents
    {
        InstancesList instance_list = 1;
        SnapshotsList snapshot_list = 2;
    }

    string log_line = 3;
    UpdateInfo update_info = 4;
}

message NetworksRequest {
    int32 verbosity_level = 1;
}

message NetInterface {
    string name = 1;
    string type = 2;
    string description = 3;
}

message NetworksReply {
    repeated NetInterface interfaces = 1;
    string log_line = 2;
    UpdateInfo update_info = 3;
}

message TargetPathInfo {
    string instance_name = 1;
    string target_path = 2;
}

message MountRequest {
    enum MountType {
        CLASSIC = 0;
        NATIVE = 1;
    }
    string source_path = 1;
    repeated TargetPathInfo target_paths = 2;
    MountMaps mount_maps = 3;
    int32 verbosity_level = 4;
    MountType mount_type = 5;
    string password = 6;
}

message MountReply {
    string log_line = 1;
    string reply_message = 2;
    bool password_requested = 3;
}

message PingRequest {
}

message PingReply {
}

message InstanceNames {
    repeated string instance_name = 1;
}

message RecoverRequest {
    InstanceNames instance_names = 1;
    int32 verbosity_level = 2;
}

message RecoverReply {
    string log_line = 1;
}

message SSHInfoRequest {
    repeated string instance_name = 1;
    int32 verbosity_level = 2;
}

message SSHInfo {
    int32 port = 1;
    string priv_key_base64 = 2;
    string host = 3;
    string username = 4;
}

message SSHInfoReply {
    map<string, SSHInfo> ssh_info = 1;
    string log_line = 2;
}

message StartError {
    enum ErrorCode {
        OK = 0;
        DOES_NOT_EXIST = 1;
        INSTANCE_DELETED = 2;
        OTHER = 3;
    }
    map<string, ErrorCode> instance_errors = 1;
}

message StartRequest {
    InstanceNames instance_names = 1;
    int32 verbosity_level = 2;
    int32 timeout = 3;
    string password = 4;
}

message StartReply {
    string log_line = 1;
    string reply_message = 2;
    UpdateInfo update_info = 3;
    bool password_requested = 4;
}

message StopRequest {
    InstanceNames instance_names = 1;
    int32 time_minutes = 2;
    bool cancel_shutdown = 3;
    int32 verbosity_level = 4;
    bool force_stop = 5;
}

message StopReply {
    string log_line = 1;
}

message SuspendRequest {
    InstanceNames instance_names = 1;
    int32 verbosity_level = 2;
}

message SuspendReply {
    string log_line = 1;
}

message RestartRequest {
    InstanceNames instance_names = 1;
    int32 verbosity_level = 2;
    int32 timeout = 3;
    string password = 4;
}

message RestartReply {
    string log_line = 1;
    string reply_message = 2;
    UpdateInfo update_info = 3;
    bool password_requested = 4;
}

message DeleteRequest {
    repeated InstanceSnapshotPair instance_snapshot_pairs = 1;
    bool purge = 2;
    int32 verbosity_level = 3;
    bool purge_snapshots = 4;
}

message DeleteReply {
    string log_line = 1;
    repeated string purged_instances = 2;
    bool confirm_snapshot_purging = 3;
}

message UmountRequest {
    repeated TargetPathInfo target_paths = 1;
    int32 verbosity_level = 2;
}

message UmountReply {
    string log_line = 1;
}

message VersionRequest {
    int32 verbosity_level = 1;
}

message VersionReply {
    string version = 1;
    string log_line = 2;
    UpdateInfo update_info = 3;
}

message GetRequest {
    string key = 1;
    int32 verbosity_level = 2;
}

message GetReply {
    string value = 1;
    string log_line = 2;
}

message SetRequest {
    string key = 1;
    string val = 2;
    int32 verbosity_level = 3;
    bool authorized = 4;
}

message SetReply {
    string log_line = 1;
    string reply_message = 2;
    bool needs_authorization = 3;
}

message KeysRequest {
    int32 verbosity_level = 1;
}

message KeysReply {
    string log_line = 1;
    repeated string settings_keys = 2;
}

message AuthenticateRequest {
    string passphrase = 1;
    int32 verbosity_level = 2;
}

message AuthenticateReply {
    string log_line = 1;
}

message SnapshotRequest {
    string instance = 1;
    string snapshot = 2;
    string comment = 3;
    int32 verbosity_level = 4;
}

message SnapshotReply {
    string snapshot = 1; // automatically generated unless specifically requested
    string log_line = 2;
}

message RestoreRequest {
    string instance = 1;
    string snapshot = 2;
    bool destructive = 3;
    int32 verbosity_level = 4;
}

message RestoreReply {
    string log_line = 1;
    string reply_message = 2;
    bool confirm_destructive = 3;
}

message CloneRequest {
    string source_name = 1;
    optional string destination_name = 2;
    int32 verbosity_level = 3;
}

message CloneReply {
    string reply_message = 1;
    string log_line = 2;
}
message DaemonInfoRequest {
    int32 verbosity_level = 1;
}

message DaemonInfoReply {
    string log_line = 1;
    uint64 available_space = 2;
    uint32 cpus = 3;
    uint64 memory = 4;
    uint64 memory_reserved = 5;
    uint64 memory_claimed = 6;
    uint64 memory_available = 7;
    uint64 memory_used_host = 8;
    uint32 cpus_claimed = 9;
    uint32 cpu_usage_permille = 10;
    repeated ResourceClaimInfo claims = 11;
}

message ResourceClaimInfo {
    string name = 1;
    string kind = 2;
    uint64 memory_bytes = 3;
    uint32 cpus = 4;
}

message WaitReadyRequest {
    int32 verbosity_level = 1;
}

message WaitReadyReply {
    string log_line = 1;
}

message Zone {
    string name = 1;
    bool available = 2;
    string subnet = 3;
}

message ZonesRequest {
    int32 verbosity_level = 1;
}

message ZonesReply {
    string log_line = 1;
    repeated Zone zones = 2;
}

message ZonesStateRequest {
    int32 verbosity_level = 1;
    bool available = 2;
    repeated string zones = 3;
}

message ZonesStateReply {
    string log_line = 1;
}

message CacheImageInfo {
    string id = 1;
    string release = 2;
    string remote_name = 3;
    string os = 4;
    repeated string aliases = 5;
    uint64 size_bytes = 6;
    int64 last_accessed = 7; // unix seconds
}

message CacheInfoRequest {
    int32 verbosity_level = 1;
}

message CacheInfoReply {
    string log_line = 1;
    uint64 total_bytes = 2;
    string cache_path = 3;
    repeated CacheImageInfo images = 4;
}

message CacheDeleteRequest {
    repeated string ids = 1;
    bool prune_expired = 2;
    int32 verbosity_level = 3;
}

message CacheDeleteReply {
    string log_line = 1;
    uint64 freed_bytes = 2;
}

message ModelSuggestion {
    string id = 1;
    string name = 2;
    string provider = 3;
    string parameter_count = 4;
    string fit_level = 5;
    double score = 6;
    string best_quant = 7;
    double memory_required_gb = 8;
    double estimated_tps = 9;
    string runtime = 10;
    string use_case = 11;
    string hf_repo = 12;
    string filename = 13;
    double disk_size_gb = 14;
    string run_mode = 15;
    double utilization_pct = 16;
    int64 context_length = 17;
    int64 usable_context = 18;
    string release_date = 19;
    string category = 20;
}

message FindModelsRequest {
    int32 verbosity_level = 1;
    int32 limit = 2;
    string use_case = 3;
    string min_fit = 4;
    string runtime = 5;
    string query = 6;
    bool include_too_tight = 7;
    int32 offset = 8;
    bool recommend_only = 9;
}

message FindModelsReply {
    string log_line = 1;
    string reply_message = 2;
    repeated ModelSuggestion models = 3;
}

message PullModelRequest {
    string model_id = 1;
    string quant = 2;
    int32 verbosity_level = 3;
    string hf_repo = 4;
}

message PullModelReply {
    string log_line = 1;
    string reply_message = 2;
    LaunchProgress launch_progress = 3;
    string model_id = 4;
    string path = 5;
}

message LoadModelRequest {
    string model_id = 1;
    string quant = 2;
    int32 ctx_size = 3;
    int32 verbosity_level = 4;
}

message LoadModelReply {
    string log_line = 1;
    string reply_message = 2;
    LaunchProgress launch_progress = 3;
    string model_id = 4;
    string openai_id = 5;
    uint32 port = 6;
    uint64 memory_claimed = 7;
    string instance_id = 8;
}

message UnloadModelRequest {
    string model_id = 1;
    int32 verbosity_level = 2;
    string instance_id = 3;
}

message UnloadModelReply {
    string log_line = 1;
    string model_id = 2;
    string instance_id = 3;
}

message LoadedModelInfo {
    string model_id = 1;
    string openai_id = 2;
    string backend = 3;
    string path = 4;
    uint32 port = 5;
    uint64 memory_claimed = 6;
    string state = 7;
    string instance_id = 8;
}

message ListModelsRequest {
    int32 verbosity_level = 1;
}

message ListModelsReply {
    string log_line = 1;
    repeated LoadedModelInfo models = 2;
    repeated ModelSuggestion cached = 3;
}

message ListLlmBackendsRequest {
    int32 verbosity_level = 1;
}

message LlmBackendInfo {
    string id = 1;
    string name = 2;
    string status = 3;
    string detail = 4;
    string binary_path = 5;
    string install_hint = 6;
    bool required = 7;
    bool active = 8;
}

message ListLlmBackendsReply {
    string log_line = 1;
    string reply_message = 2;
    string selected_backend = 3;
    repeated LlmBackendInfo backends = 4;
}

message CreateApiKeyRequest {
    string label = 1;
    int32 verbosity_level = 2;
}

message CreateApiKeyReply {
    string log_line = 1;
    string id = 2;
    string prefix = 3;
    string secret = 4;
    string label = 5;
}

message ApiKeyInfo {
    string id = 1;
    string prefix = 2;
    string label = 3;
    int64 created_at = 4;
}

message ListApiKeysRequest {
    int32 verbosity_level = 1;
}

message ListApiKeysReply {
    string log_line = 1;
    repeated ApiKeyInfo keys = 2;
}

message RevokeApiKeyRequest {
    string id = 1;
    string prefix = 2;
    int32 verbosity_level = 3;
}

message RevokeApiKeyReply {
    string log_line = 1;
    string id = 2;
}

message VerifyApiKeyRequest {
    string secret = 1;
    int32 verbosity_level = 2;
}

message VerifyApiKeyReply {
    string log_line = 1;
    bool valid = 2;
    string id = 3;
    string prefix = 4;
}

message TouchModelRequest {
    string model_id = 1;
    int32 verbosity_level = 2;
    string method = 3;
    string path = 4;
    int32 status_code = 5;
    string instance_id = 6;
}

message TouchModelReply {
    string log_line = 1;
}

message ModelActivityEntry {
    int64 timestamp_ms = 1;
    string source = 2;
    string level = 3;
    string message = 4;
}

message StreamModelLogsRequest {
    string model_id = 1;
    int32 verbosity_level = 2;
    string instance_id = 3;
}

message StreamModelLogsReply {
    string log_line = 1;
    ModelActivityEntry entry = 2;
}

message DeleteModelRequest {
    string model_id = 1;
    int32 verbosity_level = 2;
}

message DeleteModelReply {
    string log_line = 1;
    string model_id = 2;
    uint64 freed_bytes = 3;
}
